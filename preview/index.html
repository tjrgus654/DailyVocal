<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하루보컬 — 프리뷰 v3 (디자인 오버홀: 라운드 타이포·오로라 배경·아일랜드 프레임)</title>
<style>
html,body{scrollbar-width:none;-ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;}
 /* ===== DesignTokens.swift v2 반영 ===== */
 :root {
 --brand-primary: #6366F1;
 --brand-secondary: #06B6D4;
 --brand-accent: #A855F7;
 --bg-top: #0A0E27;
 --bg-bottom: #000000;
 --surface-dark: #121633;
 --border-glass: rgba(255,255,255,0.10);
 --text-secondary: #94A3B8;
 --vocal-success: #10B981;
 --vocal-warning: #F59E0B;
 --vocal-alert: #EF4444;
 }
 * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
 body {
 background:#14142a; display:flex; flex-direction:column; align-items:center;
 font-family:-apple-system, 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', 'Malgun Gothic', sans-serif;
 padding:24px; gap:14px;
 }
 .meta { color:#8b93b0; font-size:12px; }

 /* ===== iPhone 15 Pro Max 프레임 (다이내믹 아일랜드 + 상태바) ===== */
 .phone {
 width:430px; height:932px; border-radius:55px; background:#000;
 border:3px solid #2a2d3f;
 padding:0; box-shadow:0 30px 90px rgba(0,0,0,.7); position:relative; flex-shrink:0; overflow:hidden;
 }
 .island {
 position:absolute; top:11px; left:50%; transform:translateX(-50%);
 width:125px; height:36px; background:#000; border-radius:20px; z-index:50;
 }
 .statusbar {
 position:absolute; top:0; left:0; right:0; height:54px; z-index:40;
 display:flex; align-items:center; justify-content:space-between;
 padding:14px 32px 0; font-size:15px; font-weight:700; color:#fff;
 }
 .statusbar .right { display:flex; gap:6px; align-items:center; font-size:12px; }
 .screen {
 position:absolute; inset:0; overflow:hidden; display:flex; flex-direction:column; color:#fff;
 padding-top:54px; /* safe area (status bar) */
 padding-bottom:0;
 background:
 radial-gradient(900px 500px at 50% -12%, rgba(99,102,241,.20), transparent 62%),
 radial-gradient(700px 460px at 96% 108%, rgba(6,182,212,.12), transparent 60%),
 linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
 }
 .content { flex:1; overflow:hidden; display:flex; flex-direction:column; }
 .scroll { flex:1; overflow-y:auto; padding-bottom:12px; }
 .scroll::-webkit-scrollbar { display:none; }

 /* ===== 글래스 카드 v2: 상단 광택 ===== */
 .glass {
 position:relative;
 background:rgba(18,22,51,.42); backdrop-filter:blur(22px);
 border:1px solid var(--border-glass); border-radius:22px;
 box-shadow:0 8px 16px rgba(0,0,0,.30);
 }
 .glass::before {
 content:''; position:absolute; inset:0; border-radius:22px; pointer-events:none;
 border-top:1px solid rgba(255,255,255,.22);
 -webkit-mask:linear-gradient(180deg,#000 0%,transparent 42%);
 mask:linear-gradient(180deg,#000 0%,transparent 42%);
 }

 /* ===== 타이포 (SF Pro Rounded 계열 컨셉) ===== */
 .eyebrow { font-size:12px; font-weight:800; letter-spacing:.02em; }
 .screen-title { font-size:24px; font-weight:900; letter-spacing:-.01em; }
 .section-title { font-size:17px; font-weight:800; }
 .caption { font-size:12px; font-weight:800; }
 .cap2 { font-size:11px; }
 .timer-display { font-size:60px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.03em; }
 .note-display { font-size:52px; font-weight:900; letter-spacing:-.02em; }

 .tabbar {
 height:82px; border-top:1px solid var(--border-glass);
 background:rgba(6,9,24,.86); backdrop-filter:blur(24px);
 display:flex; align-items:flex-start; padding-top:10px;
 }
 .tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
 color:var(--text-secondary); font-size:10px; font-weight:700; }
 .tab svg { width:23px; height:23px; }
 .tab.active { color:var(--brand-primary); }

 .chip { padding:8px 12px; border-radius:999px; font-size:12px; font-weight:700; color:var(--text-secondary);
 background:var(--surface-dark); white-space:nowrap; border:1px solid transparent; }
 .chip.on { background:var(--brand-primary); color:#fff; }

 .btn-primary {
 display:flex; align-items:center; justify-content:center; gap:8px; height:56px; border-radius:28px;
 background:linear-gradient(90deg, var(--brand-primary), var(--brand-accent));
 color:#fff; font-size:17px; font-weight:800; letter-spacing:-.01em;
 box-shadow:0 6px 18px rgba(99,102,241,.45);
 }
 .segmented { display:flex; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.06);
 border-radius:12px; padding:3px; }
 .segmented span { flex:1; text-align:center; font-size:12.5px; font-weight:700; padding:7px 0; color:var(--text-secondary); border-radius:9px; }
 .segmented span.on { background:var(--brand-primary); color:#fff; box-shadow:0 2px 8px rgba(99,102,241,.4); }

 .toggle { width:46px; height:28px; border-radius:14px; background:var(--brand-primary); position:relative; flex-shrink:0; }
 .toggle::after { content:''; position:absolute; top:2px; right:2px; width:24px; height:24px; border-radius:50%; background:#fff; }

 .badge-note { display:inline-flex; align-items:center; gap:4px; padding:4px 9px; border-radius:999px;
 background:rgba(168,85,247,.16); color:var(--brand-accent); font-size:12px; font-weight:800; }
 .capsule-cat { display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px; font-size:12px; font-weight:800; }

 .piano { display:flex; gap:2px; padding:8px; }
 .pkey { flex:1; display:flex; flex-direction:column; gap:4px; align-items:center; }
 .pkey b { height:34px; width:100%; border-radius:5px; background:rgba(255,255,255,.10); }
 .pkey.cur b { background:var(--brand-secondary); box-shadow:0 0 10px rgba(6,182,212,.5); }
 .pkey.tgt b { background:rgba(99,102,241,.85); }
 .pkey span { font-size:9px; font-weight:800; color:var(--text-secondary); }
 .pkey.cur span { color:var(--brand-secondary); }

 .hm { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
 .hm i { height:15px; border-radius:3.5px; background:rgba(255,255,255,.055); display:block; }
 .hm i.l1 { background:rgba(99,102,241,.55); } .hm i.l2 { background:var(--brand-primary); }
 .hm i.l3 { background:var(--brand-secondary); }

 .rangerow { height:16px; border-radius:6px; background:rgba(255,255,255,.07); position:relative; overflow:hidden; }
 .rangerow b { position:absolute; left:0; top:0; bottom:0; border-radius:6px; }
 .pagefoot { padding:20px 24px 34px; display:flex; flex-direction:column; gap:14px; }
 .pageind { display:flex; gap:8px; justify-content:center; }
 .pageind i { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.22); }
 .pageind i.on { background:#fff; }
</style>
</head>
<body>
<div class="meta">하루보컬 프리뷰 v3 — 재구현 DesignTokens 기준 · 화면: <span id="scrname">routine</span></div>
<div class="phone">
 <div class="island"></div>
 <div class="statusbar"><span>9:41</span><span class="right">●●●● 5G <b>▮</b> 87%</span></div>
 <div class="screen" id="app"></div>
</div>
<div class="meta">intro / rangetest / routine / quick / tracker / lab / lab_fav / tipdetail / progress</div>

<script>
const CATS = {
 breathing:{name:'호흡 & 복압',emoji:'🫁',c:'#3C95F6'},
 falsetto:{name:'가성 스위치 & 접지',emoji:'🔊',c:'#22C588'},
 direction:{name:'소리 방향 OUT',emoji:'🎯',c:'#F47272'},
 jaw:{name:'턱 & 후두 릴랙스',emoji:'🦴',c:'#A855F7'},
 nasal:{name:'비강공명 vs 생목',emoji:'👃',c:'#F5C530'},
 practical:{name:'실전 팁 & 코노 치트키',emoji:'🎤',c:'#06B6D4'},
};
const icon = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="${n}"/></svg>`;
const TABS = [
 ['일일 루틴','M3 8h4l2 3 4-6 2 3h6M3 16h18'],
 ['피치 트래커','M2 12h3l2-6 3 12 2-6h2l2-3 2 3h4'],
 ['발성 연구소','M4 4h4v16H4zM10 4h4v8h-4zM16 4h4v12h-4z'],
 ['성장 기록','M4 20V10M10 20V4M16 20v-8M22 20h-20'],
];
const tabbar = active => `<div class="tabbar">${TABS.map((t,i)=>`
 <div class="tab ${i===active?'active':''}">${icon(t[1])}<span>${t[0]}</span></div>`).join('')}</div>`;
const hmGrid = seed => { let s=seed, out='<div class="hm">';
 const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
 for(let i=0;i<84;i++){ const future=i>76, r=rnd();
 let cls=''; if(!future&&r>0.70)cls='l1'; else if(!future&&r>0.87)cls='l2'; else if(!future&&r>0.955)cls='l3';
 out+=`<i class="${cls}"></i>`; }
 return out+'</div>'; };

const header = (eyebrow, title, right) => `
 <div style="display:flex;align-items:center;padding:4px 24px 2px;">
 <div>
 <div class="eyebrow" style="color:var(--brand-secondary);">${eyebrow}</div>
 <div class="screen-title">${title}</div>
 </div><div style="flex:1"></div>${right || ''}
 </div>`;

const SCREENS = {};

SCREENS.intro = () => `
 <div class="content" style="justify-content:flex-end;">
 <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:0 32px;">
 <div style="position:relative;width:216px;height:216px;border-radius:50%;background:rgba(99,102,241,.14);display:flex;align-items:center;justify-content:center;">
 <div style="position:absolute;inset:24px;border-radius:50%;border:3px solid rgba(99,102,241,.7);box-shadow:0 0 26px rgba(99,102,241,.45);"></div>
 <div style="font-size:96px;filter:drop-shadow(0 6px 18px rgba(99,102,241,.6));">🎤</div>
 </div>
 <div class="screen-title" style="font-size:26px;text-align:center;line-height:1.35;">하루 15분,<br>목소리가 달라집니다</div>
 <div style="color:var(--text-secondary);text-align:center;font-size:15px;line-height:1.7;">발성 이론을 몰라도 괜찮습니다.<br>52가지 발성 비법과 실시간 피치 가이드로<br>혼자서도 고음을 편안하게 올려보세요.</div>
 </div>
 <div class="pagefoot">
 <div class="btn-primary">다음 <span style="font-size:15px;">→</span></div>
 <div class="cap2" style="text-align:center;color:var(--text-secondary);">로그인 없이 모든 기능이 기기 내에 안전하게 저장됩니다.</div>
 <div class="pageind"><i class="on"></i><i></i><i></i><i></i></div>
 </div>
 </div>`;

SCREENS.rangetest = () => `
 <div class="content" style="justify-content:flex-end;">
 <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 28px;">
 <div class="screen-title">내 음역대 측정</div>
 <div style="color:var(--text-secondary);text-align:center;font-size:15px;line-height:1.7;">마이크를 켜고, 가장 낮은 목소리부터<br>천천히 올라가 최고음까지 gliding 해보세요.<br>이 측정이 성장 기록의 기준선이 됩니다.</div>
 <div class="glass" style="width:100%;padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px;">
 <div class="note-display" style="color:var(--brand-secondary);">F3</div>
 <div class="cap2" style="color:var(--text-secondary);font-variant-numeric:tabular-nums;">174.6 Hz</div>
 <div style="display:flex;align-items:center;gap:24px;margin-top:4px;">
 <div style="text-align:center;"><div class="cap2" style="color:var(--text-secondary);">최저음</div>
 <div style="font-size:23px;font-weight:900;font-variant-numeric:tabular-nums;">G2</div></div>
 <div style="width:1px;height:34px;background:rgba(255,255,255,.12);"></div>
 <div style="text-align:center;"><div class="cap2" style="color:var(--text-secondary);">최고음</div>
 <div style="font-size:23px;font-weight:900;font-variant-numeric:tabular-nums;">A4</div></div>
 </div>
 </div>
 <div style="display:flex;gap:12px;align-items:center;">
 <div style="padding:12px 22px;border-radius:999px;background:var(--vocal-alert);font-size:13px;font-weight:800;">⏸ 일시정지</div>
 <div style="font-size:13px;font-weight:800;color:var(--vocal-success);">✓ 측정 완료!</div>
 </div>
 </div>
 <div class="pagefoot">
 <div class="btn-primary">다음 <span style="font-size:15px;">→</span></div>
 <div class="pageind"><i></i><i></i><i class="on"></i><i></i></div>
 </div>
 </div>`;

const routineBody = (opt) => {
 const step = opt.step, total = opt.total, remaining = opt.remaining, note = opt.note,
 cat = opt.cat, subtitle = opt.subtitle, sound = opt.sound, emoji = opt.emoji,
 analogyTitle = opt.analogyTitle, analogyDesc = opt.analogyDesc, mode = opt.mode;
 const pct = 0.62;
 const dots = Array.from({length: total}, (_, i) =>
 `<div class="dot" style="width:${i===step-1?14:9}px;height:${i===step-1?14:9}px;
 background:${i<step-1?'var(--vocal-success)':i===step-1?'var(--brand-primary)':'rgba(255,255,255,.18)'};
 ${i===step-1?'box-shadow:0 0 8px rgba(99,102,241,.85);border:2px solid var(--brand-secondary);':''}"></div>`).join('');
 return `
 <div class="content">
 <div class="scroll">
 ${header('하루보컬 · 일일 루틴', mode, `
 <div style="display:flex;align-items:center;gap:8px;">
 <div style="display:flex;gap:4px;align-items:center;">
 <div style="width:6px;height:6px;border-radius:50%;background:var(--vocal-alert);"></div>
 <span style="font-size:10px;color:var(--text-secondary);font-weight:700;">분석 중</span>
 </div>
 <div class="glass" style="border-radius:12px;padding:6px 12px;display:flex;gap:4px;align-items:center;font-size:12px;font-weight:800;">
 🔥 <span>${opt.badge}</span>
 </div>
 </div>`)}

 <div class="segmented" style="margin:10px 20px 6px;">
 <span class="${mode.includes('퀵')?'':'on'}">15분 풀코스</span><span class="${mode.includes('퀵')?'on':''}">2분 퀵</span>
 </div>

 <div style="position:relative;width:258px;height:258px;margin:8px auto 2px;">
 <div style="position:absolute;inset:0;border-radius:50%;border:13px solid rgba(255,255,255,.06);"></div>
 <div style="position:absolute;inset:0;border-radius:50%;border:13px solid transparent;
 background:conic-gradient(from 270deg, var(--brand-secondary), var(--brand-primary), var(--brand-accent) ${pct*360}deg, rgba(255,255,255,.06) ${pct*360}deg 360deg);
 -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 13.5px),#000 calc(100% - 13px));
 mask:radial-gradient(farthest-side,transparent calc(100% - 13.5px),#000 calc(100% - 13px));
 filter:drop-shadow(0 2px 14px rgba(99,102,241,.4));"></div>
 <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;">
 <div class="eyebrow" style="color:var(--brand-secondary);">STEP ${step}/${total}</div>
 <div class="timer-display">${remaining}</div>
 <div class="badge-note">🎵 ${note}</div>
 </div>
 </div>

 <div style="display:flex;gap:12px;justify-content:center;margin:8px 0 16px;">${dots}</div>

 <div class="glass" style="margin:0 20px;padding:18px;display:flex;flex-direction:column;gap:13px;">
 <div style="display:flex;align-items:center;">
 <span class="capsule-cat" style="background:${cat.c}33;color:${cat.c};">${cat.emoji} ${cat.name}</span>
 <div style="flex:1"></div>
 <div style="display:flex;gap:4px;align-items:flex-end;">
 <span style="font-size:11px;color:var(--brand-accent);font-weight:800;">♪</span>
 <span style="font-size:13px;color:var(--brand-accent);font-weight:900;font-variant-numeric:tabular-nums;">${note}</span>
 </div>
 </div>
 <div>
 <div class="section-title">${subtitle}</div>
 <div style="font-size:12px;margin-top:5px;color:var(--text-secondary);">소리 형태: <b style="color:var(--brand-secondary);">${sound}</b></div>
 </div>
 <div style="display:flex;gap:12px;">
 <div style="font-size:27px;width:44px;height:44px;border-radius:50%;background:var(--surface-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;">${emoji}</div>
 <div>
 <div style="font-size:14px;font-weight:800;color:var(--brand-primary);">${analogyTitle}</div>
 <div style="font-size:13px;color:var(--text-secondary);line-height:1.6;margin-top:4px;">${analogyDesc}</div>
 </div>
 </div>
 <div style="text-align:center;color:var(--brand-secondary);font-size:12px;font-weight:700;">실천 요령 더보기 ⌄</div>
 </div>

 <div class="glass" style="margin:14px 20px 6px;padding:14px;">
 <div style="display:flex;align-items:center;gap:8px;">
 <span style="font-size:18px;color:var(--brand-secondary);">🎹</span>
 <div style="flex:1">
 <div style="font-size:12px;font-weight:800;">피아노 가이드 톤 자동 재생</div>
 <div class="cap2" style="color:var(--text-secondary);">스텝별 최적 스케일을 들으며 따라 부르기</div>
 </div>
 <div class="toggle"></div>
 </div>
 <div style="height:1px;background:rgba(255,255,255,.08);margin:12px 0;"></div>
 <div class="segmented"><span>남성 키 (C3)</span><span class="on">여성 키 (C4)</span></div>
 <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;">
 <span style="font-size:12px;font-weight:800;">키 미세조정</span>
 <div style="display:flex;align-items:center;gap:10px;font-size:12px;font-weight:800;color:var(--brand-secondary);">
 <span style="width:26px;height:26px;border-radius:50%;background:var(--surface-dark);display:flex;align-items:center;justify-content:center;">−</span>
 <span style="min-width:36px;text-align:center;">+2키</span>
 <span style="width:26px;height:26px;border-radius:50%;background:var(--surface-dark);display:flex;align-items:center;justify-content:center;">+</span>
 </div>
 </div>
 </div>
 </div>

 <div style="display:flex;gap:20px;align-items:center;padding:0 24px 16px;">
 <div style="width:52px;height:52px;border-radius:50%;background:var(--surface-dark);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:17px;">⏮</div>
 <div class="btn-primary" style="flex:1;">⏸ 일시정지</div>
 <div style="width:52px;height:52px;border-radius:50%;background:var(--surface-dark);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:17px;">⏭</div>
 </div>
 </div>
 ${tabbar(0)}`;
};

SCREENS.routine = () => routineBody({
 mode:'3주차: 파사지오', badge:'3주차: 파사지오', step:3, total:5, remaining:'02:47', note:'A#3',
 cat:CATS.falsetto, subtitle:'파사지오(2옥 솔/라) 돌파', sound:'네이 네이 (Nay)', emoji:'🦆',
 analogyTitle:'마녀 웃음 & 오리 소리 비유',
 analogyDesc:'과장된 코맹맹이 \'네이\'로 성대를 얇게 유지하면, 힘을 쓰지 않고도 2옥타브 후반을 통과할 수 있습니다.',
});

SCREENS.quick = () => routineBody({
 mode:'퀵 2분', badge:'⚡ 퀵 모드', step:1, total:1, remaining:'01:12', note:'G3',
 cat:CATS.breathing, subtitle:'립트릴 → 허밍 → 사이렌 압축 세트', sound:'부르르 → 음- → 우에에엥', emoji:'⚡',
 analogyTitle:'엔진 예열 비유',
 analogyDesc:'노래방 가기 전 2분. 차가운 엔진으로 출발하면 1곡 만에 목이 나갑니다. 세 동작만 빠르게 돌리면 성대가 깨어납니다.',
});

SCREENS.tracker = () => {
 const keys=['C3','D3','E3','F3','G3','A3','B3','C4','D4','E4','F4','G4','A4','B4','C5'];
 return `
 <div class="content">
 <div class="scroll">
 ${header('실시간 음정 코칭', '피치 트래커', `

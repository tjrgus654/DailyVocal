<style>

<body>
<div class="meta">하루보컬 — <b>실제 동작 프로토타입</b> · 마이크 YIN 피치 감지 · WebAudio 가이드 톤 · localStorage 영속화 · 화면: <span id="scrname">onboarding</span></div>
<div class="phone">
 <div class="island"></div>
 <div class="statusbar"><span>9:41</span><span style="font-size:12px;">●●●● 5G ▮ 87%</span></div>
 <div class="screen"><div class="content" id="app"></div></div>
 <div class="toast" id="toast"></div>
</div>
<div class="meta">프레임 하단 탭으로 이동 · 우측 하단 "엔진 자가진단"으로 마이크 없이 YIN 정확도 검증</div>
<button id="selftest" style="position:fixed;right:24px;bottom:24px;z-index:99;" class="btn-ghost">🔧 엔진 자가진단</button>

<script>
"use strict";
// ============================================================
// 1) 음악 유틸 (VocalAudioEngine statics 와 동일 스펙)
// ============================================================
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const a4Ref = () => { const v = (typeof Store !== "undefined" && Store.data && Store.data.prefs && Store.data.prefs.a4) || 440; return Math.min(445, Math.max(435, v)); };
const midiToFreq = m => a4Ref() * Math.pow(2.0, (m - 69.0) / 12.0);
function freqToNoteCents(f){
 if (f <= 0) return {note:"--", midi:0, cents:0};
 const exact = 69.0 + 12.0 * Math.log2(f / a4Ref());
 const midi = Math.round(exact);
 return {note: NOTE_NAMES[((midi%12)+12)%12] + (Math.floor(midi/12)-1), midi, cents:(exact-midi)*100};
}
const fmtClock = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(Math.floor(s%60)).padStart(2,"0")}`;

// ============================================================
// 2) YIN 피치 감지기 (Core/Audio/YINPitchDetector.swift 의 JS 포팅)
// 차분함수는 순수 루프(Swift 은 vDSP SIMD — 결과 동일 스펙)
// ============================================================
function yinDetect(samples, sampleRate, minF=65, maxF=1050, threshold=0.15, fallbackMax=0.45){
 const W = Math.floor(samples.length / 2);
 if (W < 256 || sampleRate <= 0) return {frequency:0, confidence:0};
 const maxTau = Math.min(Math.floor(sampleRate / minF), W - 2);
 const minTau = Math.max(2, Math.floor(sampleRate / maxF));
 if (maxTau - minTau < 3 || samples.length < W + maxTau + 1) return {frequency:0, confidence:0};

 // Step 1: 차분함수
 const d = new Float32Array(maxTau + 2);
 for (let tau = 1; tau <= maxTau; tau++){
 let sum = 0;
 for (let i = 0; i < W; i++){ const dx = samples[i] - samples[i+tau]; sum += dx*dx; }
 d[tau] = sum;
 }
 // Step 2: CMNDF
 const cmndf = new Float32Array(maxTau + 2); cmndf.fill(1);
 let run = 0;
 for (let tau = 1; tau <= maxTau; tau++){
 run += d[tau];
 cmndf[tau] = run > 0 ? d[tau] * tau / run : 1;
 }
 // Step 3: 임계값 탐색 → 로컬 최소로 하강
 let est = 0, tau = minTau;
 while (tau < maxTau){
 if (cmndf[tau] < threshold){
 while (tau + 1 < maxTau && cmndf[tau+1] < cmndf[tau]) tau++;
 est = tau; break;
 }
 tau++;
 }
 if (est === 0){
 let minVal = Infinity;
 for (let t = minTau; t < maxTau; t++) if (cmndf[t] < minVal){ minVal = cmndf[t]; est = t; }
 if (minVal >= fallbackMax) return {frequency:0, confidence:0};
 }
 if (est < 1 || est + 1 > maxTau) return {frequency:0, confidence:0};
 // Step 4: 포물선 보간
 const s0 = cmndf[est-1], s1 = cmndf[est], s2 = cmndf[est+1];
 const den = 2 * (2*s1 - s2 - s0);
 let shift = 0;
 if (Math.abs(den) > 1e-9) shift = (s2 - s0) / den;
 const refined = est + shift;
 if (refined <= 1) return {frequency:0, confidence:0};
 const f0 = sampleRate / refined;
 if (f0 < minF*0.95 || f0 > maxF*1.05) return {frequency:0, confidence:0};
 return {frequency: f0, confidence: Math.max(0, Math.min(1, 1 - s1))};
}

// ============================================================
// 3) 오디오 엔진 (마이크 + 가이드 톤) — VocalAudioEngine 미러
// ============================================================
const Audio5 = {
 ctx: null, analyser: null, micStream: null, buf: null,
 running: false, amplitude: 0, freq: 0, noteName: "--", cents: 0,
 prev1: 0, prev2: 0, lastVoiced: 0, listeners: [],
 SILENCE_GATE: 0.02,

 ensureCtx(){
 if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
 if (this.ctx.state === "suspended") this.ctx.resume();
 return this.ctx;
 },

 async startMic(){
 if (this.running) return true;
 try {
 const ctx = this.ensureCtx();
 this.micStream = await navigator.mediaDevices.getUserMedia({
 audio: {echoCancellation:false, noiseSuppression:false, autoGainControl:false}
 });
 const src = ctx.createMediaStreamSource(this.micStream);
 this.analyser = ctx.createAnalyser();
 this.analyser.fftSize = 2048;
 this.buf = new Float32Array(this.analyser.fftSize);
 src.connect(this.analyser);
 this.running = true;
 this.loop();
 return true;
 } catch (e) {
 this.running = false;
 return false;
 }
 },
 stopMic(){
 this.running = false;
 if (this.micStream){ this.micStream.getTracks().forEach(t => t.stop()); this.micStream = null; }
 this.amplitude = 0; this.freq = 0; this.noteName = "--"; this.cents = 0;
 this.prev1 = this.prev2 = this.lastVoiced = 0;
 this.listeners.forEach(fn => fn(0, "--", 0, false));
 },

 loop(){
 if (!this.running) return;
 requestAnimationFrame(() => this.loop());
 this.analyser.getFloatTimeDomainData(this.buf);
 // RMS
 let sum = 0;
 for (let i = 0; i < this.buf.length; i++) sum += this.buf[i]*this.buf[i];
 const rms = Math.sqrt(sum / this.buf.length);
 this.amplitude = this.amplitude * 0.6 + rms * 0.4;
 const voicedFrame = rms > this.SILENCE_GATE;
 if (!voicedFrame){
 this.freq = 0; this.noteName = "--"; this.cents = 0;
 this.prev1 = this.prev2 = this.lastVoiced = 0;
 this.listeners.forEach(fn => fn(0, "--", 0, false));
 return;
 }
 const est = yinDetect(this.buf, this.ctx.sampleRate);
 if (est.frequency <= 0 || est.confidence < 0.55){
 this.listeners.forEach(fn => fn(0, "--", 0, false));
 return;
 }
 // 옥타브 점프 거부 (앱 엔진과 동일 규칙)
 if (this.lastVoiced > 0){
 const ratio = est.frequency / this.lastVoiced;
 if ((ratio > 1.9 || ratio < 0.55) && est.confidence < 0.85) return;
 }
 // 중앙값-3 스무딩
 const cands = [est.frequency];
 if (this.prev1 > 0) cands.push(this.prev1);
 if (this.prev2 > 0) cands.push(this.prev2);
 cands.sort((a,b)=>a-b);
 const stable = cands[Math.floor(cands.length/2)];
 this.prev2 = this.prev1; this.prev1 = stable; this.lastVoiced = stable;
 const conv = freqToNoteCents(stable);
 this.freq = stable; this.noteName = conv.note; this.cents = conv.cents;
 this.listeners.forEach(fn => fn(stable, conv.note, conv.cents, true));
 },

 onPitch(fn){ this.listeners.push(fn); },

 // 가이드 톤: 삼각파+2배음+ADSR (makeToneBuffer 미러)
 playTone(freq, dur=0.7, vol=0.5){
 if (freq < 20 || freq > 8000) return;
 const ctx = this.ensureCtx();
 const t0 = ctx.currentTime + 0.02;
 const oscs = [[1, 1.0], [2, 0.3], [3, 0.12]].map(([h, g]) => {
 const o = ctx.createOscillator();
 o.type = "sine"; o.frequency.value = freq * h;
 const gain = ctx.createGain();
 gain.gain.value = g;
 o.connect(gain);
 return {o, gain};
 });
 const master = ctx.createGain();
 const attack = 0.03, decay = 0.15, sustain = 0.65, release = Math.min(0.2, dur*0.3);
 master.gain.setValueAtTime(0.0001, t0);
 master.gain.linearRampToValueAtTime(vol, t0 + attack);
 master.gain.linearRampToValueAtTime(vol * sustain, t0 + attack + decay);
 master.gain.setValueAtTime(vol * sustain, t0 + Math.max(attack+decay, dur - release));
 master.gain.linearRampToValueAtTime(0.0001, t0 + dur);
 oscs.forEach(({gain}) => gain.connect(master));
 master.connect(ctx.destination);
 oscs.forEach(({o}) => { o.start(t0); o.stop(t0 + dur + 0.05); });
 },
 playNoteMidi(m, dur){ this.playTone(midiToFreq(m), dur); },
};

// ============================================================
// 4) 영속 저장소 (SwiftData UserProfile/Session/PitchRecord 미러)
// ============================================================
const Store = {
 KEY: "vocal5_live_v1",
 data: null,
 defaults(){
 return {
 onboardingDone:false, measured:false,
 baseline:{lo:0, hi:0}, range:{lo:0, hi:0},
 sessions:[], pitchRecords:[], frozenDays:[], freezeTokens:2,
 favorites:[], prefs:{femaleKey:false, transpose:0, autoplay:true},
 };
 },
 load(){
 try { this.data = Object.assign(this.defaults(), JSON.parse(localStorage.getItem(this.KEY) || "{}")); }
 catch(e){ this.data = this.defaults(); }
 return this.data;
 },
 save(){ localStorage.setItem(this.KEY, JSON.stringify(this.data)); },
};
Store.load();

// 4시 롤오버 실천일 키 (ProgressViewModel.practiceDayKey 미러)
function practiceDayKey(date){
 const d = new Date(date.getTime() - 4*3600*1000);
 return rawKey(d);
}
// 실천일 공간의 "그날 시작" 정규화 키 (롤오버 재적용 금지)
function rawKey(date){
 return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
}
// 스트릭 + 보호권 자동 소모 (calculateStreak 미러)
function calcStreak(){
 const days = new Set(Store.data.sessions.map(s => practiceDayKey(new Date(s.date))));
 const frozen = new Set(Store.data.frozenDays);
 let tokens = Store.data.freezeTokens, streak = 0, consumed = null, frozenUsed = 0;
 let cursor = new Date(Date.now() - 4*3600*1000); cursor.setHours(0,0,0,0); // 현재 실천일 시작(이중 시프트 금지)
 const key = d => rawKey(d);
 // 오늘을 아직 안 했다면 스트릭은 어제 기준으로 살아 있을 수 있음.
 // 어제 결석이라도 프리즈가 브리지할 수 있으므로 조기 종료하지 않고 루프에서 판정.
 if (!days.has(key(cursor))) cursor.setDate(cursor.getDate() - 1);
 for (let i = 0; i < 366; i++){
 const k = key(cursor);
 const prev = new Date(cursor); prev.setDate(prev.getDate() - 1);
 if (days.has(k)) streak++;
 else if (frozen.has(k)) frozenUsed++;
 else if (tokens > 0 && (days.has(key(prev)) || frozen.has(key(prev)))){ tokens--; consumed = k; }
 else break;
 cursor = prev;
 }
 // 읽기 전용(P2-4): 소모는 세션 완료 시 settleFreezeTokens에서 1회만.
 return {streak, consumedDays: consumed ? [consumed] : [], frozenUsed: frozenUsed + (consumed ? 1 : 0)};
}
// 성종(voice type) 추정 — VocalLogic.estimateVoiceType 미러
function midiOf(f){ return Math.round(69 + 12 * Math.log2((f || 440) / 440)); }
function estimateVoiceType(loMidi, hiMidi, ceilMidi, isFemale){
 if (hiMidi - loMidi < 10) return "미확정";
 const mid = Math.floor((loMidi + hiMidi) / 2);
 if (isFemale === true){
  if (mid >= 66 && ceilMidi >= 76) return "소프라노";
  if (mid >= 62 && ceilMidi >= 71) return "메조소프라노";
  return "알토";
 }
 if (isFemale === false){
  if (mid >= 50 && ceilMidi >= 62) return "테너";
  if (mid >= 47 && ceilMidi >= 59) return "바리톤";
  return "베이스";
 }
 if (mid >= 66) return ceilMidi >= 76 ? "소프라노" : "메조소프라노";
 if (mid >= 62) return "메조소프라노";
 if (mid >= 60) return "알토";
 if (mid >= 50) return ceilMidi >= 62 ? "테너" : "바리톤";
 if (mid >= 47) return "바리톤";
 return "베이스";
}
function passaggioZone(type){
 const zones = {"테너":[66,69],"바리톤":[64,67],"베이스":[62,65],"알토":[74,77],"메조소프라노":[74,77],"소프라노":[74,78]};
 return zones[type] || null;
}
// 단일 쓰기 지점(P2-4): 세션 완료 시 1회. 이미 동결된 날은 재차감 없음(멱등).
function settleFreezeTokens(){
 const days = new Set(Store.data.sessions.map(s => practiceDayKey(new Date(s.date))));
 const before = Store.data.freezeTokens;
 const r = calcStreak();  // 이제 읽기 전용 — consumedDays만 반환
 if (r.consumedDays.length){
 Store.data.frozenDays.push(...r.consumedDays);
 Store.data.freezeTokens = Math.max(0, before - r.consumedDays.length);
 }
 return {consumed: r.consumedDays.length, tokens: Store.data.freezeTokens};
}
window.settleFreezeTokens = settleFreezeTokens;
function weeklyDays(){
 const days = new Set(Store.data.sessions.map(s => practiceDayKey(new Date(s.date))));
 const now = new Date(); now.setHours(0,0,0,0);
 const ws = new Date(now); ws.setDate(ws.getDate() - ((ws.getDay() + 6) % 7)); // 월요일
 let c = 0;
 for (let i = 0; i < 7; i++){
 const d = new Date(ws); d.setDate(ws.getDate() + i);
 if (days.has(rawKey(d))) c++;
 }
 return c;
}
function heatmapData(){
 const counts = {};
 Store.data.sessions.forEach(s => { const k = practiceDayKey(new Date(s.date)); counts[k] = (counts[k]||0)+1; });
 const now = new Date(); now.setHours(0,0,0,0);
 const ws = new Date(now); ws.setDate(ws.getDate() - ((ws.getDay() + 6) % 7));
 const start = new Date(ws); start.setDate(ws.getDate() - 11 * 7);
 const cells = [];
 for (let i = 0; i < 84; i++){
 const d = new Date(start); d.setDate(start.getDate() + i);
 const k = rawKey(d);
 cells.push(`<i class="${counts[k]>=3?'l3':counts[k]===2?'l2':counts[k]===1?'l1':''}"></i>`);
 }
 return cells.join("");
}

// ============================================================
// 5) 루틴 프리셋 (RoutinePresets 미러 — 축약본)
// ============================================================
const STEPS_FULL = [

 bins: new Array(12).fill(0),
 // 온보딩 측정
 measuring:false, mLo:0, mHi:0, mFrames:0, mLive:"--", mFreq:0,

function stepsForMode(){
 if (App.mode === "rest") return STEPS_REST;
 return App.mode === "quick" ? STEPS_QUICK : STEPS_FULL;
}
function setCondition(v){
 Store.data.prefs.cond = v; Store.save(); haptic();
 if (v === 2 && App.mode !== "rest"){
 if (App.running) pauseRoutine();
 App.mode = "rest";
 App.steps = stepsForMode(); App.stepIdx = 0;
 App.stepEnd = Date.now() + currentStep().dur * 1000;
 App.totalElapsed = 0; App.stepElapsed = 0; App.completed = new Set();
 toast("목이 아픈 날은 쉬는 것도 훈련입니다.<br>아주 작은 빨대 발성과 허밍만 하는 2분 루틴으로 바꿨어요.", 3600);
 }
 if (v !== 2 && App.mode === "rest"){
 App.mode = "full";
 App.steps = stepsForMode(); App.stepIdx = 0;
 App.stepEnd = Date.now() + currentStep().dur * 1000;
 App.totalElapsed = 0; App.stepElapsed = 0; App.completed = new Set();
 }
 render();
}
window.setCondition = setCondition;
function currentStep(){ return App.steps[App.stepIdx]; }
function remainingSec(){ return Math.max(0, Math.floor((App.stepEnd - Date.now())/1000)); }

const $app = document.getElementById("app");
function toast(msg, ms=2200){
 const el = document.getElementById("toast");
 el.innerHTML = msg; el.classList.add("show");
 clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), ms);
}
function haptic(ms=12){ if (navigator.vibrate) navigator.vibrate(ms); }

const TABS = [

];
const tabbar = () => `<div class="tabbar">${TABS.map(([id,label,path])=>`
 <button class="tab ${App.tab===id?'active':''}" onclick="go('${id}')">

function go(tab){
 if (App.tab === "routine" && tab !== "routine" && App.running) pauseRoutine();
 if (App.tab === "tracker" && tab !== "tracker" && App.listening) stopTracking();
 App.tab = tab; haptic(); render();
}
window.go = go;

function render(){
 document.getElementById("scrname").textContent =
 Store.data.onboardingDone ? App.tab + (App.mode === "quick" && App.tab === "routine" ? "(퀵)" : "") : "onboarding";
 if (!Store.data.onboardingDone) $app.innerHTML = screenOnboarding();

async function measureToggle(){
 if (App.measuring){ App.measuring = false; Audio5.stopMic(); render(); return; }
 App.measuring = true; App.mLo = 0; App.mHi = 0; App.mFrames = 0; render();
 const ok = await Audio5.startMic();
 if (!ok){ App.measuring = false; toast("마이크 권한이 거부되었습니다.<br>브라우저 주소창의 🎙 아이콘에서 허용해주세요."); render(); }
}
function onPitchForMeasure(f, note, cents, voiced){
 if (!App.measuring || !voiced) { if(!App.measuring) return; }
 if (App.measuring && voiced){
 App.mLive = note; App.mFreq = f; App.mFrames++;
 if (App.mLo === 0 || f < App.mLo) App.mLo = f;
 if (f > App.mHi) App.mHi = f;
 if (App.mFrames % 6 === 0) render();
 }
}
function finishOnboarding(){
 if (App.mFrames >= 12){
 Store.data.baseline = {lo:App.mLo, hi:App.mHi};
 Store.data.range = {lo:App.mLo, hi:App.mHi};
 Store.data.measured = true;
 }
 Store.data.onboardingDone = true; Store.save();
 Audio5.stopMic(); App.measuring = false;
 render();
}
window.measureToggle = measureToggle; window.finishOnboarding = finishOnboarding;

function setMode(m){
 if (m === App.mode) return;
 if (App.running) pauseRoutine();
 App.mode = m; App.steps = stepsForMode(); App.stepIdx = 0;
 App.totalElapsed = 0; App.stepElapsed = 0; App.completed.clear();
 App.stepEnd = Date.now() + currentStep().dur * 1000;
 haptic(); render();
}
function toggleAutoplay(){ Store.data.prefs.autoplay = !Store.data.prefs.autoplay; Store.save(); haptic(); render(); }
function setKey(f){ Store.data.prefs.femaleKey = f; Store.save(); haptic(); render(); }
function nudgeTranspose(d){
 Store.data.prefs.transpose = Math.max(-5, Math.min(5, Store.data.prefs.transpose + d));
 Store.save(); haptic(); render();
}
function toggleRoutine(){ App.running ? pauseRoutine() : startRoutine(); }
async function startRoutine(){
 // 성대 보호 가드: 목이 아프면 일반 루틴을 절대 실행하지 않는다.
 if ((Store.data.prefs.cond || 0) === 2 && App.mode !== "rest"){
 App.mode = "rest";
 App.steps = stepsForMode(); App.stepIdx = 0; App.totalElapsed = 0;
 App.stepElapsed = 0; App.completed = new Set();
 App.stepEnd = Date.now() + currentStep().dur * 1000;
 toast("목이 아픈 날은 쉬는 것도 훈련입니다.<br>아주 작은 빨대 발성과 허밍만 하는 2분 루틴으로 바꿨어요.", 3600);
 }
 App.running = true; App.doneAlert = false;

 let started = false;
 App.history.forEach((p, i) => {

 const y = yOf(Math.max(minF, p.f));
 if (!started){ ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
 });
 ctx.stroke();
 const last = App.history[App.history.length - 1];
 const ly = yOf(Math.max(minF, last.f));
 ctx.fillStyle = last.onPitch ? "rgba(16,185,129,.35)" : "rgba(6,182,212,.35)";
 ctx.beginPath(); ctx.arc(W - 4, ly, 9, 0, 7); ctx.fill();
 ctx.fillStyle = last.onPitch ? "#10B981" : "#06B6D4";
 ctx.beginPath(); ctx.arc(W - 4, ly, 5, 0, 7); ctx.fill();
 }
}

function synthTone(freq, seconds, sr){
 // 앱의 가이드 톤과 동일 조성(기음+2배음+0.12x)을 안정 구간에서 샘플맅
 const n = Math.floor(sr * seconds);
 const out = new Float32Array(n);
 for (let i = 0; i < n; i++){
 const t = i / sr;
 out[i] = (Math.sin(2*Math.PI*freq*t) + 0.3*Math.sin(2*Math.PI*freq*2*t) + 0.12*Math.sin(2*Math.PI*freq*3*t)) / 1.42 * 0.6;
 }
 return out;
}
function runSelfTest(){
 const sr = 48000;
 const cases = [82.41, 110, 220, 329.63, 440, 659.25];
 const results = cases.map(expected => {
 const samples = synthTone(expected, 0.35, sr);
 const est = yinDetect(samples, sr);
 const centsErr = est.frequency > 0 ? 1200 * Math.log2(est.frequency / expected) : Infinity;
 return {expected, got: est.frequency, centsErr, pass: est.frequency > 0 && Math.abs(centsErr) <= 20 && est.confidence >= 0.55};
 });
 // 무성 신호(백색노이즈)도 기각해야 함
 const noise = new Float32Array(sr * 0.3);
 for (let i = 0; i < noise.length; i++) noise[i] = (Math.random()*2-1) * 0.005; // 매우 조용한 노이즈
 const noiseEst = yinDetect(noise, sr);
 const noisePass = noiseEst.frequency === 0;
 const all = results.every(r => r.pass) && noisePass;
 window.__selfTestResult = {results, noiseRejected: noisePass, all};
 const rows = results.map(r =>
 `<tr><td style="padding:2px 8px;text-align:right;">${r.expected.toFixed(2)}</td>
 <td style="padding:2px 8px;text-align:right;">${r.got>0?r.got.toFixed(2):"—"}</td>
 <td style="padding:2px 8px;text-align:right;">${isFinite(r.centsErr)?r.centsErr.toFixed(1):"—"}</td>
 <td style="padding:2px 8px;color:${r.pass?'#10B981':'#EF4444'};font-weight:800;">${r.pass?"PASS":"FAIL"}</td></tr>`).join("");
 toast(`
 <b>🔧 YIN 엔진 자가진단 — ${all?"전체 통과 ✅":"실패 ❌"}</b><br>
 <table style="font-size:11px;margin-top:8px;border-collapse:collapse;font-variant-numeric:tabular-nums;">
 <tr style="color:#94A3B8;"><th style="padding:2px 8px;">목표(Hz)</th><th style="padding:2px 8px;">측정(Hz)</th><th style="padding:2px 8px;">오차(¢)</th><th style="padding:2px 8px;"></th></tr>
 ${rows}
 </table>
 <span style="font-size:11px;color:#94A3B8;">무음 기각: ${noisePass?"PASS ✅":"FAIL ❌"} · Swift YINPitchDetector와 동일 스펙</span>`, 8000);
 return window.__selfTestResult;
}
window.runSelfTest = runSelfTest;
document.getElementById("selftest").addEventListener("click", () => runSelfTest());

    const f = m2 => 440 * Math.pow(2, (m2 - 69) / 12);
    App.history = t.traj.map((m, i) => ({
     f: f(m), note: "x", cents: 0, onPitch: t.midis ? t.midis.includes(m) : false,
     t: Date.now() - ((t.traj.length - i) * 280),
    }));
   }
   if (t.bins){ App.bins = new Array(12).fill(0); t.bins.forEach(b => App.bins[b[0]] = b[1]); }
   if (typeof t.score === "number"){ App.lastScore = t.score; App.voiced = 40; App.hits = Math.round(40 * t.score / 100); }
   render(); drawCanvas();
   const acc = document.getElementById("acc");
   if (acc && App.voiced) acc.textContent = Math.round(App.hits / App.voiced * 100) + "%";
  }
 } catch(e){ window.__qaErr = e.message; console.warn("qa seed failed", e); }
})();

render();
</script>
</body>
</html>

name: DailyVocal
options:
  bundleIdPrefix: com.tjrgus654
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  DailyVocal:
    type: application
    platform: iOS
    sources:
      - path: HaruVocalApp.swift
      - path: Core
      - path: Design
      - path: Models
      - path: ViewModels
      - path: Views
      - path: Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleIdentifier: com.tjrgus654.dailyvocal
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSSupportsLiveActivities: true

schemes:
  DailyVocal:
    build:
      targets:
        DailyVocal: all
    run:
      config: Debug
    test:
      config: Debug
